version: '3.8'

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: guardianeye-backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend/guardianeye.db:/app/guardianeye.db
      - ./backend/uploads:/app/uploads
    restart: always

  frontend:
    image: node:20-alpine
    container_name: guardianeye-frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run build && npx -y serve -s dist -l 5173"
    ports:
      - "5173:5173"
    depends_on:
      - backend
    restart: always
